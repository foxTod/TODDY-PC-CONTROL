[package]
name = "pc-remote-control"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5"
dotenvy = "0.15.7"
eframe = "0.37.0"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
teloxide = { version = "0.17.0", features = ["macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
